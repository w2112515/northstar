name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: api tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    name: web lint + copy check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # "lint" = eslint + the banned-copy scanner (scripts/check-copy.mjs)
      - run: npm run lint
      - run: npm run build
